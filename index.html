<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora de Descontos</title>
</head>

<body>

    <div class="card">
        <h2>Calculadora de Desconto</h2>
        <form id="discountForm">
            <div class="form-group">
                <label for="valorCompra">Valor da Compra (R$):</label>
                <input type="number" id="valorCompra" step="0.01" placeholder="Ex: 150.00" required>
            </div>

            <div class="form-group">
                <label for="resultado">Resultado:</label>
                <!-- O input abaixo é o que você chamou de imputResultado -->
                <input type="text" id="resultado" readonly placeholder="Aguardando cálculo...">
            </div>

            <button type="submit">Calcular</button>
        </form>
    </div>
</body>
<script src="main.js"></script>

</html>
